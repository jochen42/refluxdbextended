name: PR Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "false"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: cargo nextest (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils build-essential curl pkg-config libssl-dev clang lld git protobuf-compiler libprotobuf-dev zstd libz-dev python3-dev python3-pip
          # the CLI plugin/processing-engine tests shell out to a python env
          pip3 install --user pip setuptools || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: pr-tests
          cache-all-crates: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        # nextest runs every test in its own process, which isolates the
        # env-var-mutating and global-singleton tests that flake under
        # cargo test's in-process threading. Doctests are not run (several
        # are broken in upstream v3.9.3).
        run: |
          cargo nextest run --workspace --no-fail-fast --retries 2 --failure-output immediate-final
